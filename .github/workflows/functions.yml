name: Deploy API (Cloud Functions)

# The API is deployed separately from the site: the frontend is a static export
# on Pages, this is the server half. Only runs when something the bundle
# actually contains changes, so a copy tweak doesn't redeploy the backend.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "src/app/api/**"
      - "src/lib/**"
      - "src/types/**"
      - "firebase.json"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: functions-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Required to mint the OIDC token Google exchanges for credentials.
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The bundle pulls handlers out of src/, so the app's dependencies have to
      # be present — not just functions/'s own.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test the code being deployed
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: Authenticate to Google Cloud
        # Workload Identity Federation: GitHub proves who it is with a
        # short-lived OIDC token, so there is no service-account key stored in
        # this repo to leak or rotate. The provider only accepts tokens from
        # this repository.
        uses: google-github-actions/auth@v2
        with:
          project_id: devfestmilano26
          workload_identity_provider: projects/911916014755/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@devfestmilano26.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy functions
        # firebase.json's predeploy hook installs and bundles functions/ first.
        run: pnpm dlx firebase-tools@15 deploy --only functions --project devfestmilano26 --non-interactive

      - name: Report the deployed URL
        run: |
          pnpm dlx firebase-tools@15 functions:list --project devfestmilano26 --non-interactive || true
          echo "If this URL differs from the NEXT_PUBLIC_API_BASE_URL repository variable, the site will call the wrong host."
